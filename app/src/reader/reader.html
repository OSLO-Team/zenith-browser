<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src http: https: data:; style-src 'self'; script-src 'self';">
  <title>Okuma Modu - OSLO</title>
  <link rel="stylesheet" href="reader.css">
</head>

<body>
  <div class="reader-app">
    <header class="reader-toolbar">
      <div class="reader-toolbar-left">
        <button id="reader-back" class="reader-icon-btn" title="Geri" aria-label="Geri">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20v-2z" fill="currentColor" />
          </svg>
        </button>
        <div class="reader-brand">
          <span class="reader-dot"></span>
          <span id="reader-brand-label">Okuma Modu</span>
        </div>
      </div>
      <div class="reader-toolbar-actions">
        <button id="reader-font-down" class="reader-icon-btn text-btn" title="Yazıyı küçült" aria-label="Yazıyı küçült">A-</button>
        <button id="reader-font-up" class="reader-icon-btn text-btn" title="Yazıyı büyüt" aria-label="Yazıyı büyüt">A+</button>
        <button id="reader-theme" class="reader-icon-btn" title="Tema" aria-label="Tema">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.11-1.36A6.5 6.5 0 0 1 12.36 3.1C12.24 3.04 12.12 3 12 3z"
              fill="currentColor" />
          </svg>
        </button>
        <a id="reader-original-link" class="reader-original-link" href="#">Orijinal</a>
      </div>
    </header>

    <main class="reader-main">
      <article class="reader-article" id="reader-article">
        <div id="reader-loading" class="reader-loading">Hazırlanıyor...</div>
      </article>
    </main>
  </div>

  <script src="reader.js"></script>
</body>

</html>
